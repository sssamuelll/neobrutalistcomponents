name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# npm Trusted Publishing (OIDC): no NPM_TOKEN. npm verifies this exact
# workflow (repo + file name) through GitHub's id-token, and attaches
# provenance automatically. Configure once on npmjs.com:
# package → Settings → Trusted Publisher → GitHub Actions → publish.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib
      - run: npm run check:package
      - run: npm publish --access public
