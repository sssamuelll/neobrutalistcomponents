name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: llms.txt, the skill and the README's study table are up to date
        run: |
          npm run gen:llms
          git diff --exit-code public/llms.txt public/llms-full.txt skills/neobrutalist-ui/SKILL.md README.md
      - name: Site bundle sanity
        run: |
          test -f site-dist/index.html
          test -f site-dist/llms.txt

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
